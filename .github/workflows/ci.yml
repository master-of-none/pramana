name: checks
# Pushes to main, and pull requests. A push to a PR branch used to run twice (push and
# pull_request events for the same commit).
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels its older, unfinished run; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    # A full run takes about 2.5 minutes; stop a hung one long before the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest
      - run: uv run python scripts/check_links.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Browser regressions (deterministic fixtures, desktop and mobile)
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
      - run: uv build
      - name: Install and check wheel outside the checkout
        run: |
          uv venv --python 3.12 /tmp/pramana-wheel
          uv pip install --python /tmp/pramana-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/pramana-wheel/bin/python "$GITHUB_WORKSPACE/scripts/check_wheel.py"
