[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pramana-rag"
version = "0.1.0"
description = "Local retrieval with verifiable sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "sentence-transformers>=5.0,<6",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
pramana = "pramana.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pramana"]

[tool.hatch.build]
artifacts = ["src/pramana/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the explicitly downloaded embedding model"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
